# Start: cp .env.example .env, edit it, then `docker compose up -d`.
# Uses the ready-made image from Docker Hub; `docker compose up -d --build` builds it from this checkout instead.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasklog
      POSTGRES_USER: tasklog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasklog -d tasklog"]
      interval: 5s
      retries: 10

  tasklog:
    image: ${TASKLOG_IMAGE:-lulo464/tasklog:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://tasklog:${POSTGRES_PASSWORD}@db:5432/tasklog
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
      - uploads:/uploads
    ports:
      - "8080:8080"

volumes:
  db-data:
  uploads:
